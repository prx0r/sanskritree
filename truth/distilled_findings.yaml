## Candidate Λ_Φ — Feeling as pre-thought valuation

passage:
  ref: user_hypothesis
  text: "Feeling is pre-thought reactions. Gut instinct. Subverbal processing. Useful for survival."

claims:
  weak: "Affective valuation (feeling) is phylogenetically and ontogenetically prior to conceptual thought. Organisms evaluate their states before representing them."
  strong: "Therefore phenomenal manifestness IS affective valuation — a state is manifest because it matters. Λ_Φ = the organism's valenced concern."

audit:
  establishes: |
    A plausible bridge between the Ñāṇananda sequence (nimitta → vedanā → valuation → appropriation → self)
    and the enactive/interoceptive models (Seth, Damasio, Levin).
    Feeling as primitive valuation predates cognition — it's what makes a state relevant to an organism.
  missing_premise: |
    That valuation (mattering) entails manifestness (phenomenality). A state can matter to a system
    without being experienced — a thermostat's reading matters for its function, but is not felt.
    The missing premise is "why does valenced processing light up as feeling rather than just execute?"
  countermodel: |
    Damasio's homeostasis without consciousness: a simple organism maintains viability through
    valenced responses (approach/avoid) without any phenomenal glow. Feeling-as-valuation explains
    behavior but not phenomenality. The gap persists.

verdict:
  status: "valuation_explains_function_not_manifestness"
  frontier: "What converts valenced processing into felt experience? Or is the intuition that there IS a gap ('why does it light up?') itself the mistake — is feeling just what we call valenced processing from the inside?"
