## Sambandhasiddhi (Establishment of Relation)

claims:
  weak: "Relation (sambandha) is not reducible to convention, spatial contiguity, or causal dependence. It is the unity of many within a single cognitive act (rūpasaṃśleṣa = aikātmya)."
  strong: "Therefore all relations are modes of one universal consciousness."

audit:
  establishes: "A sophisticated theory of relation as consciousness's self-unifying activity. The knower cannot be divided within a single cognitive act (mātṛbheda argument)."
  missing_premise: "That entities' essence IS consciousness (cinmātravapus). The text assumes this from the ĪPK framework rather than arguing it. Verse 8 presupposes the Pratyabhijñā ontology."
  countermodel: "Vākyapadīya's meaning-unity model: holistic comprehension can explain relational unity without a metaphysical subject. Also Nyāya: inherence in a substance explains co-presence without cosmic identity."

verdict:
  status: "relation_theory_established_universalization_assumed"
  frontier: "Does Sambandhasiddhi's theory of relation require the Pratyabhijñā ontology, or is it compatible with a process or meaning-based account?"

