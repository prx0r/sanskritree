# Distilled Findings — All Translations in EO-style Format

## Ajadapramātṛsiddhi (Establishment of the Non-Inert Knower)

claims:
  weak: "Conscious manifestation cannot be reduced to inert presentation. Object-determination occurs within a first-personal field."
  strong: "Therefore all cognitions belong to one universal subject (Śiva)."

audit:
  establishes: "Intrinsic reflexivity and cross-temporal synthesis require more than passive information processing."
  missing_premise: "Reflexive manifestation cannot be numerically partitioned. That is, 'sarvārthasaṃvidām' (all cognitions) must mean all cognitions of every subject, not all cognitions within one stream. Abhinavagupta himself (Tantrāloka 16.242) limits anusandhāna to one body."
  countermodel: "Nyāya plural selves: each stream has its own enduring subject. Shared reflexive structure does not entail numerical identity."

verdict:
  status: "weak_claim_established_strong_claim_invalid"
  frontier: "What justifies treating shared reflexive structure as numerical identity rather than a universal property instantiated by many subjects?"

