## Spandakārikā 1 — Unmeṣa/Nimeṣa (dynamic continuity)

passage:
  ref: SpK_1 (Dyczkowski)
  text: "WE PRAISE THAT SANKARA WHO IS THE SOURCE OF THE POWER OF THE WHEEL OF ENERGIES BY WHOSE EXPANSION (UNMESA) AND CONTRACTION (NIMESA) THE UNIVERSE IS ABSORBED AND COMES INTO BEING."
  translation: "We praise Śiva, whose expansion and contraction constitute the universe's appearance and dissolution."

claims:
  weak: "Reality is dynamic, not static. Manifestation alternates between expansion and contraction phases. Subjecthood is not a sealed container but a rhythm."
  strong: "Therefore subjecthood is a dynamically maintained regime of opening/closing, not a persisting substance — supporting a process model over both Nyāya and simple Pratyabhijñā substantialism."

audit:
  establishes: "A non-substantialist model of unity: the subject is a metastable rhythm of integration and differentiation, not a static owner. This directly addresses Λ_T (temporal continuity) and FPG-07."
  missing_premise: "That dynamic continuity (spanda) can serve as a law of phenomenal binding AND exclusion — not just as a description of change. The Spanda model describes the RHYTHM of manifestation but does not specify why manifestation occurs in EXCLUSIVE domains."
  countermodel: "Krama sequence: cognitive phases (emergence → stabilization → withdrawal → transition) explain temporal structure without requiring one universal dynamism. Also Levin: bioelectric rhythms maintain cellular organization without cosmic consciousness."

verdict:
  status: "dynamic_model_identified_exclusion_not_explained"
  frontier: "Can Spanda's expansion-contraction model be extended to explain why phenomenal domains are exclusive (not just why they change)? Or does exclusion require a different principle?"

