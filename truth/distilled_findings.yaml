## Īśvarasiddhi (Establishment of Lordship)

claims:
  weak: "The world's coordinated functional organization requires an intelligent cause."
  strong: "Therefore the Lord (Īśvara) is the inner self of all beings, identical with finite subjects."

audit:
  establishes: "At most, a Nyāya-style design inference: organized effects require an intelligent director. The text works within a dualistic framework."
  missing_premise: "The nondual identity of finite subjects with the Lord. Verse 56 explicitly defers this: 'if that highest recognition must be established, its structure has been set out by us elsewhere.'"
  countermodel: "Evolutionary self-organization: functional coordination arises through natural selection, not intelligent design. Also Nyāya: a single Lord who supervises but is not identical with finite selves."

verdict:
  status: "design_argument_established_nondual_identity_deferred"
  frontier: "Does 'elsewhere' (the ĪPK) actually supply the missing nondual proof? Checkpoint 10 says no."

