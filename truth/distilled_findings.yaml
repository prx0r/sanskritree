## Checkpoint 10 / graph1 reframing

claims:
  weak: "All major theories of consciousness (naturalist, Buddhist, Nyāya, Pratyabhijñā, neutral monist) can be expressed as {X → Λ → Dᵢ} where Λ is a missing partition function."
  strong: "Therefore the partition problem is the real problem, and universalization was a special case."

audit:
  establishes: |
    Six sub-laws: Λ_G (grounding), Λ_P (participation), Λ_B (biological),
    Λ_Φ (phenomenal binding), Λ_T (temporal), Λ_A (appropriation).
    13 frontier pressures (FPG-01 through FPG-13).
    None can substitute for another. In particular, Λ_B (functional unity) ⇏ Λ_Φ (phenomenal unity).
  missing_premises:
    - "What determines the local mode of participation (πᵢ)?"
    - "Is the ultimate ground itself manifest?"
    - "What converts organizational distinction into absence from a field?"
    - "Why should causal, informational, or semantic unity constitute phenomenal unity?"
  countermodel: "Independent duplication: each instance of manifest capacity is independently fundamental. This explains privacy directly but must explain why many independent tokens share the same structure."

verdict:
  status: "partition_problem_is_real_problem_no_theory_solves_it"
  frontier: "The 8 unanswered questions from graph1 §19: (1) Is M₀ real? (2) Is M₀ manifest? (3) What individuates πᵢ? (4) What selects Σᵢ as one agent? (5) What constitutes Λ_Φ? (6) What turns the field into 'mine'? (7) What does recognition reveal about M₀? (8) Why should any of this entail unrestricted freedom?"

