## Tantrāloka 16.242 — Exclusion

passage:
  ref: AbhT_16.242
  text: "pradeśavṛtti ca jñānamātmanastatra tatra tat / bhogyajñānaṃ nānyadeheṣv anusandhānam arhati"
  translation: "Knowledge that is localized and enjoyed in one body cannot perform connective synthesis (anusandhāna) with other bodies."

claims:
  weak: "Connective synthesis (the unity of cognition across moments) is restricted to one body. Knowledge in one body does not extend to another."
  strong: "Therefore subjects are genuinely separate — the universalization from 'synthesis within one stream' to 'synthesis across all streams' is invalid within the tradition's own terms."

audit:
  establishes: "Abhinavagupta himself qualifies anusandhāna as local per body. This is a direct constraint on Utpaladeva's universalization argument in APS 17."
  missing_premise: "If anusandhāna across bodies is impossible, then 'sarvārthasaṃvidām' (all cognitions) in APS 17 must refer to cognitions within one stream, not all cognitions of every subject. The universalization requires a different argument."
  countermodel: "The verse could be read as describing ordinary empirical cognition (vyavahāra) rather than ultimate reality (paramārtha). The Pratyabhijñā response would be that the limitation is epistemic, not metaphysical."

verdict:
  status: "local_synthesis_confirmed_transpersonal_universalization_blocked"
  frontier: "If Abhinavagupta himself blocks cross-body anusandhāna, what positive argument remains for transpersonal numerical identity?"

