## Tantrāloka 3.276-283 — Viśvātmatā (Universal Selfhood)

passage:
  ref: AbhT_3.276-283
  text: "vyāpi svatantraṃ sarvajñaṃ yacchivaṃ parikalpitam // viśvātmakatvaṃ cetyanyallakṣaṇaṃ kiṃ nu kathyatām // sraṣṭā viśvātmaka iti prathayā bhairavātmatā"

claims:
  weak: "Śiva is characterized as all-pervading, independent, omniscient. The creator is the universal self — this is the nature of Bhairava."
  strong: "Therefore the individual subject is numerically identical with this universal self."

audit:
  establishes: "The tradition's characterization of ultimate reality as universal selfhood. The description is explicit."
  missing_premise: "That descriptive characterizations of ultimate reality entail that finite subjects ARE that reality in a numerical identity sense. The text describes what Śiva IS; it does not argue that each finite subject IS Śiva in the same sense."
  countermodel: "Participation model (Proclus/Checkpoint 20): finite subjects participate in universal selfhood without being numerically identical with it. The text is compatible with both identity and participation readings."

verdict:
  status: "universal_selfhood_textually_explicit_interpretation_underdetermined"
  frontier: "Does 'viśvātmaka' (universal self) mean (a) the self is the universe, (b) the self of the universe, or (c) the self that is participated in by all?"

