## Vākyapadīya 1.1 — Śabdatattva as ground

passage:
  ref: BVaky_1.1
  text: "anādinidhanam brahma śabdatattvaṃ yad akṣaram / vivartate 'rthabhāvena prakriyā jagato yataḥ"
  translation: "Brahman, the word-principle, without beginning or end, the imperishable — from which the process of the world transforms as objects."

claims:
  weak: "Reality has a linguistic/meaning-bearing character. The structure of the world is not brute matter but articulated significance."
  strong: "Therefore consciousness (as meaning-manifestation) is the ground of reality — supporting the Pratyabhijñā claim."

audit:
  establishes: "A powerful alternative model of unity: not a persisting subject, but unitary meaning (sphoṭa/pratibhā) grasped holistically across sequential elements."
  missing_premise: "That meaning-unity IS phenomenal unity. A text, sentence, or mathematical structure can possess holistic organization without being experienced. Bhartṛhari's 'pratibhā' (intuitive flash) may explain how meaning is grasped, but not why the grasping is manifest."
  countermodel: "Computational semantics: meaning can be processed without consciousness. The unity of a sentence does not entail a unified subject."

verdict:
  status: "meaning_alternative_identified_phenomenal_gap_remains"
  frontier: "Does 'pratibhā' (Bhartṛhari's intuitive flash of comprehension) involve phenomenal manifestness intrinsically, or is it a cognitive function that could operate non-consciously?"

