## Vākyapadīya 1.115 — Sphoṭa as unitary meaning-whole

passage:
  ref: BVaky_1.115
  text: "sphotasyābhinnakālasya dhvanikālānupātinaḥ / vyaktaye svasya rūpasya śabdatvena vivartate"
  translation: "The sphoṭa (unitary meaning-whole), which is beyond temporal sequence, manifests through sounds that follow time — to reveal its own nature."

claims:
  weak: "Meaning is not composed additively from sequential parts. Comprehension is holistic: the whole is grasped in a flash (pratibhā), not built up from parts."
  strong: "Therefore the unity of meaning (sphoṭa) provides a model for phenomenal unity that does not require a subject-substance."

audit:
  establishes: "A non-substantial model of unity: the whole precedes and conditions its parts. Temporal sequence belongs to expression, not to meaning itself."
  missing_premise: "That the conditions for semantic unity are the same as the conditions for phenomenal unity. Sequential phonemes becoming one meaning may be structurally analogous to separate sensations becoming one experience, but analogy is not identity."
  countermodel: "IIT or GNWT: neural integration explains phenomenal binding without requiring a meaning-whole. Bhartṛhari's model describes comprehension, not consciousness."

verdict:
  status: "sphota_as_unity_model_interesting_phenomenal_application_unproved"
  frontier: "Can semantic unity (sphoṭa) serve as a model for phenomenal unity, or does consciousness require a different kind of binding?"

