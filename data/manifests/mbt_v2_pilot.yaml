- id: mbt.v1.30.a8fc
  chapter: '1'
  verse: '30'
  type: verse
  transliteration: Devanagari
  critical_status: vision_ocr_unreviewed
  source_page: '32'
  sanskrit: 'कुमारिकाखण्ड: नवधागतिरागत्य” गकारादिव्यवस्थितम् ।। ३० ॥'
  translations:
  - id: mbt.v1.30.a8fc.en.dyczkowski
    translator_id: dyczkowski.mark
    translator: Mark S. G. Dyczkowski
    type: published_translation
    language: en
    text: CHAPTER TWO 17 (Vrknanātha), the one who possesses nine modalities (gati),60
      having come (into the world) the (Nine Nāthas) starting with the one (whose
      name begins with the) letter Ga are established (here).61 While the maSÆalas
      of the sixteen supports are those beginning with Bharga’s place (bhargasthāna).62
      (In this way) the unfailing current of disciples (śinyogha), that brings great
      prosperity, has come into being. (30cd-31) The Body (piSÆa) and the Fifty Clans
      of the Wave of Sonic Energy 63The Body (piSÆa), endowed with the bliss of Navātman,
      is said to be KuSÆalinī. Her nature the Body (of letters) (piSÆarūpā), in (her
      onward) advance (kramaSa) in association with the transmission (kramabheda),
      she resides in (all) the sacred seats (pī˜ha). By the sequence of (her) descent
      (avatārakrama) she is established in the End of the Twelve and (so) Vakrikā
      has descended as (both) supreme (transcendent) and inferior (immanent) so that
      the current (ogha) of the extension of (her spiritual) family may exist.64 And
      that energy (kalā) is the Bliss of Stillness (nirānandā).65 (32-34ab) She resides
      within the world of transmigration (saˆsāra) and so she, the supreme energy
      (kalā), is (called) Tara‰giSī (the Wave (of power that flows through manifestation).66
      Divided into the fifty clans (gotra),67 she is the energy (called) Śivā and
      her nature the Body (of letters) (piSÆarūpā).68 (34cd-35ab) Śiva (It is) auspicious
      (śiva), the (divine medicinal) herb beyond the sphere of transmigration and
      free of change, then (that reality which is) aloof (from the world) and has
      no name (anāma) is said to be `Śiva.69 (35cd-36ab) The Plane of Repose Vakrā
      resides between the (two psychic nerves) IÆā and Pi‰galā70 and is the Plane
      of Repose.71 Arisen from (the god who is the primal) cause (of all things),
      she is always (well) established and follows Śivas Path.72 (Blue) like the flower
      of the hemp plant (atasī),73 she has six faces74 and is the supreme energy.
      (36cd-37) Realisation, Authority and the Goddess of the Transmission 75The supreme
      energy (kalā), whose form is (the goddesss) Vidyā (vidyārūpā), abides endowed
      with consciousness. Supreme and in accord with the Command of realised consciousness
      (vijñānājñā), her sign of attainment (pratyaya) is manifold.76 Indeed, she,
      Vakrikā, is the lord of the worlds (bhuvanādhipati)77 and is Kula (the aggregate
      of energies). She is well known in the post of authority (adhikāra) and is sustained
      by the five Principles.78 (38-39)
    source_page: '33'
