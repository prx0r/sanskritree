- id: mbt.v3.17.f89b
  chapter: '3'
  verse: '17'
  type: verse
  transliteration: Devanagari
  critical_status: vision_ocr_unreviewed
  source_page: '40'
  sanskrit: कुमारिकाखण्डः ६८ या सा शक्तिर्भगाख्या च जगन्माता त्रिरक्षरी । .७२ सा चाज्ञा
    कौलिनी व नपुंसकपदे स्थिता ।। १७ ।।
  translations:
  - id: mbt.v3.17.f89b.en.dyczkowski
    translator_id: dyczkowski.mark
    translator: Mark S. G. Dyczkowski
    type: published_translation
    language: en
    text: 'CHAPTER THREE 25 That energy called the Yoni (bhaga) who is the mother
      of the universe and consists of three letters,29 is the Command, Kaulinī who
      abides on the plane of the Neuter One (napuˆsakapada).30 (17) ŚrīkaS˜ha said:
      You are the Yoni, the Supreme Space (paramākāśa), the Divine Li‰ga,31 the Neuter
      (absolute).32 (You are) the Womb (garbha), the best of inner sanctums and, by
      virtue of the bliss of the Yoni, (you are) Bhairavī.33 (18) (You are) Kaulinī,
      the well established Command and (you have) three forms, by virtue of the three
      divisions (of the Tradition). Due to the transmission in many forms (bahurūpakrameSa)
      you are the one deity of the Kula (kuladevatā).34 (19) You, O goddess, are the
      mother of the worlds, O grandmother,35 (you are) the source (yoni) of the universe.
      By you and by me, O mistress of the gods, the triple world is woven warp and
      woof. (20) I am not, as it were, your disciple but (rather) have come in friendship.36
      (Indeed) O goddess, the knowledge of ritual is close to you because of (our)
      previous affection.37 (21) And (I) have come (as one who) craves knowledge,
      thus, O Umā, tell me. I have imparted (this) most excellent knowledge to you
      many times and you also have explained it to me completely in the past. Therefore,
      O Supreme One (Parā), our condition as disciples (of one another) is uncompromised.38
      All (there is between us is) affection, O auspicious one, and so speak without
      (harbouring any) doubt for I desire Kaulika knowledge which is the experience
      (of ultimate reality) (pratyayātmaka). (22-24) The venerable (goddess) Kaulinī
      said: O ŚrīkaS˜ha, what are you saying! The truth is that you are Umās lord
      who has come (into this world) in the form of a man (but) with the nature of
      a god.39 (You who are) wise, wear the garment of Māyā and, out of love, are
      greedy for me, O Śambhu, it is apparent by your voice that (it is you) deluded
      by the net of Māyā. You have came (here), greedy for knowledge, to destroy the
      darkness (of ignorance). I have understood (this is so) why, O great Śambhu,
      do you conceal yourself?40 O Great Lord, what is the reason (for this)? O my
      dearly beloved, I will explain (things) truly (as they are) (yathāvrtta).41
      (25-28)'
    source_page: '41'
