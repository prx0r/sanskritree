- id: mbt.v1.5.a559
  chapter: '1'
  verse: '5'
  type: verse
  transliteration: Devanagari
  critical_status: vision_ocr_unreviewed
  source_page: '20'
  sanskrit: कुमारिकाखण्डः वृत्ताध्युष्ट क्रमार्थ रचितमनुभवं खञ्जिनीमूर्तिपूर्व दिव्योऽय
    देवसंज्ञ पुनरपि अपर मानवं त्रिक्रमौघम् । भेदानेकैर्विभिन्न” सकलपदक्रमं मण्डलं
    षट्प्रकार ६८ संकेत कादिपूर्व सकलगुणयुतं मण्डलं भैरव तम् ।। ५ ।।
  translations:
  - id: mbt.v1.5.a559.en.dyczkowski
    translator_id: dyczkowski.mark
    translator: Mark S. G. Dyczkowski
    type: published_translation
    language: en
    text: CHAPTER ONE 5 The purport of the Transmission (kramārtha) is set in (these)
      three and a half (verses) (vrttādhyun˜a).35 It is the experience (of deity)
      that has been composed (racita in verse) in accord with (pūrva) Khañjinīs form
      (mūrti). This is the Divine Current (divyaugha) called that of the gods (devasaˆjña).
      There is also the other (apara) (immanent) one namely, the Current of the Triple
      Transmission (trikrama), which is human (mānava). (Thus) the maSÆala consisting
      of six parts (prakāra) is the entire Krama with all its parts (sakalapadakrama)36
      divided into many types (bheda).37 The teaching (saˆketa) commences with (the
      sacred seat whose name) begins with `Kā38 and, endowed with all the qualities,
      is Bhairavas maSÆala. (5) Śrīnāthas questions concerning the SaˆvartāmaSÆalasūtra
      Śrīnātha said:39 (1) Who acts within the maSÆala? (2) How is the maSÆala? (3)
      How is the power of bliss? (4) How is it that that energy is horrific? (6) (5)
      Once taken up its enclosure (āvaraSa), how is the sequence of parts (padakrama)
      (within the maSÆala)? (6) (What is) the tetrad in the pattern of emanation?
      (7) How is Akula? (7) Again, (8) what is Kula said to be? (9) How is the activity
      of Kula (kulācāra)? (10) What, in brief, is the pentad, the group of six and
      (the second) four? (8) (11) What is the (second) pentad and, again, the (third
      group of) four? (12) How is the sixteenfold Command? (13) Where (does) the consecration
      (take place) in the beginning? (14) Pray tell me (about) the eight deities.
      (9) (15) And how is that (group of eight) within the icon (of the deity) (mūrti)?40
      (16) How is the Gesture (mudrā) there? (17) How is the Transmission (krama)
      of the Child and that of the Youth and the Aged? (10) (18) What is the energy
      (kalā), the supreme Śārvī41 who is the Krama Deity (devatā) of (all) the Transmissions
      (krama)? (19) What is the City of the Moon (candrapurya)42 said to be? (20)
      What is the (true) nature of Śrīnātha? (11) (21) How is the conclusion (avasāna)
      (of the transmission)43 namely, the sixteenfold current of disciples? (22) What
      is the family (santāna), the body (formed from the) clans (gotrapiSÆa) and the
      entire sequence of parts (padakrama)? (12)
    source_page: '21'
