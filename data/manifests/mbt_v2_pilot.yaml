  type: verse
  transliteration: Devanagari
  critical_status: vision_ocr_unreviewed
  source_page: '28'
  sanskrit: कुमारिकाखण्डः गृहवर्गसमोपेत कुलाष्टकसमन्वितम् । चक्राष्टकसमायुक्त ं ब्रह्माणीदेवताष्टकम्
    ।। १३ ॥
  translations:
  - id: mbt.v2.13.04e8.en.dyczkowski
    translator_id: dyczkowski.mark
    translator: Mark S. G. Dyczkowski
    type: published_translation
    language: en
    text: CHAPTER TWO 13 The Eight Deities 28The group of eight deities (beginning
      with) BrahmāSī29 is associated with eight wheels,30 the Octad of Kula, the classes
      (of phonemes) and the houses (grha). (13) The Gesture 31The energy of Gesture
      (mudrāśakti) is said to be that by which the universe is made manifest (mudrita
      lit. ‘stamped’). It is the fourfold emanation that takes place in the fourfold
      aggregate of elements (bhūtagrāma). 32 (14) The Three Transmissions and the
      Deity of the Transmission The Transmission (krama) of the Child, that of Youth
      and the Transmission of the Aged, in due order.33 34Established (saˆvyavasthitā)35
      on the triple path, by means of the Path of the Stations of the Equinox (vinuvasthāna),36
      the energy of the Void (khakalā) is established within the New Moon at the end
      of the Full Moon37 (pūrSamāsī).38 That energy should be known to be the energy
      of the Void and, full (pūrSā), it abides within the Heart.39 (15-16) The Tradition
      (anvaya) is called the Śrīmata and the goddess is she who moves (throughout)
      the Three Worlds by means of the Sequence of Sixty-four (energies).40 She is
      said to be Vakrikā, the goddess of the transmissions (kramadevī). (17) The City
      of the Moon 41The City of the Moon is located in the centre of the Union of
      Emission (visargayoga). It is the foundation of the MaSÆala of SūnmaSā42 and
      transports the waves of nectar.43 (18) Śrīnātha The supreme, omniform (viśvarūpa)
      reality (tattva) is located within the Transmental (unmanānte). That is Śrīnātha
      (otherwise know as) Kujīśa who sustains the Kula (kulālambin)44 and is the leader
      of those who have achieved perfection (siddhanāyaka).45 (19)
    source_page: '29'
