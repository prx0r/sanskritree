  translations:
  - id: mbt.v3.8.d777.en.dyczkowski
    translator_id: dyczkowski.mark
    translator: Mark S. G. Dyczkowski
    type: published_translation
    language: en
    text: 'CHAPTER THREE 23 That is the triangle in the centre of that which is one
      hundred and fifty leagues (in diameter śatārdha).13 (This), the house of the
      earth and the abode of the gods, possesses three girdles (mekhalā).14 (8) Light
      red (ārakta) (in colour)15 and shining (like) silver, its form is as brilliant
      as a hundred suns. (The sides of the triangle extend for) five times twenty
      (pañcaviˆśa) leagues. In the middle of that is the unbroken circle. (9) In the
      centre of that is Kulakālikā, the semi-circle of the Moon.16 The Circle of the
      Sun (ravimaSÆala), which is the self (ātman) (of the maSÆala),17 is one hundred
      and fifty leagues (śatārdha) (in diameter).18 (10) In centre of that is the
      Gesture of the Transmission (kramamudrā).19 It is the Command, which is the
      teacher in the Three Traditions (uli). (The lineages of) the Eldest, the Middling
      and the Child along with the divine one (divya), the Transmission of the Skyfarers
      (khecarakrama).20 (All) that, indeed, is the Western House (veśman) called the
      City of the Moon. This is the first maSÆala21 and the (the source of) authority
      for (initiates) who recite mantras. (11-12) (This maSÆala) has one foot22 and
      consists of the triple energy conjoined with the Triple Vidyā.23 And in the
      middle of that is Kaulinī,24 she who, by means of the practice of bliss (sukhopāya),
      possesses authority. She whose form is a lion, resides (there) facing downwards
      in the shape of a Li‰ga.25 (13-14ab) ŚrīkaS˜ha speaks with the Goddess The lord
      (bhagavān) Rudra, he who is ŚrīkaS˜ha, husband of Umā, enquired (of the goddess).
      (14cd) ŚrīkaS˜ha said: 26Who has acquired authority in this, the Teachers House
      free of ties, the Li‰ga in the centre, arisen as the Yoni (bhaga)? Who resides
      (here as) the teacher of men?27 (15) The venerable (goddess) Kaulinī said: It
      is I myself who here possess the authority of the Western House (grha) which
      is the Transmission of Sadyojāta.28 Previously, it was given (to me by my) teacher.
      (16)'
    source_page: '39'
