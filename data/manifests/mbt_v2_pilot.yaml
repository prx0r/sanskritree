  critical_status: vision_ocr_unreviewed
  source_page: '36'
  sanskrit: श्रीवक्रा उवाच तृतीयानन्दः कैलासस्यापरे मूर्ती मेरुमन्दिरमूर्धनि । महारामे
    च रम्ये च तूष्णीनाथगुहाश्रमम् ।। १ ।।
  translations:
  - id: mbt.v3.1.f02a.en.dyczkowski
    translator_id: dyczkowski.mark
    translator: Mark S. G. Dyczkowski
    type: published_translation
    language: en
    text: 'CHAPTER THREE Daknas Curse and Grace The Goddesss Li‰ga: The Triangle in
      the Centre The venerable (goddess) Vakrā said: The cave hermitage (āśrama) of
      TūnSīnātha (the Silent Lord) is located in a large and beautiful grove situated
      on the peak of the temple of Meru, which is another form of (mount) Kailāsa.1
      (1) It is triangular and appears to have seven sections (skandha).2 It is surrounded
      by the Octad of Kula.3 The triangle that is in the middle of that (Octad of
      Kula) extends for one hundred leagues (yojana).4 (2) That is the Stone (śilā),
      beautiful as the moon, the light of which is like heated gold. It is decorated
      with jewels, pearls and corals and is most delightful. (3) It is clearly visible
      (suspan˜ā),5 greatly illumined, like the light of ten million moons. It possesses
      seven sections (skandha) and is endowed with five seats (āsana).6 (4) There
      is a circular form in the centre of that which is eighty-six leagues7 in diameter
      (vistāra). And below (the foundation) is as clean as pure crystal. (5) It possesses
      two arches8 and is adorned with eight ramparts. Endowed with the group of eight
      deities,9 it is very terrible and horrific. (6) Its abode is the unbroken circle
      (akhaSÆamaSÆalāvāsa)10 and is adorned with the Lions Sound (siˆhanāda).11 Endowed
      with (the vowels) `A and the rest (as well as the consonants) `Ka and so forth,12
      it is the great means (to draw the deity) near (mahāsānnidhyakaraSa). (7)'
    source_page: '37'
