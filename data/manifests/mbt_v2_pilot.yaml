  chapter: '1'
  verse: '13'
  type: verse
  transliteration: Devanagari
  critical_status: vision_ocr_unreviewed
  source_page: '22'
  sanskrit: कुमारिकाखण्डः षोडशान्त क्रमान्त किं २ शेषा वै मण्डलानि ४ । परिभ्रमं न
    में ज्ञात विमलं तु विशेषतः ।। १३ ।।
  translations:
  - id: mbt.v1.13.5376.en.dyczkowski
    translator_id: dyczkowski.mark
    translator: Mark S. G. Dyczkowski
    type: published_translation
    language: en
    text: CHAPTER ONE 7 (23) What is the End of the Sixteen which is the culmination
      (anta) of the Transmission (kramānta)?44 (24) What are the remaining maSÆalas?
      (25) I have not known the rotation (paribhrama) (of KuSÆalinī), particularly
      the pure one. (13) All this, in brief, is the teaching concerning the essential
      nature of the object(s) of worship.45 (26) How will the (spiritual) sons know
      its eighteen divisions? (14) (27) How is the Division of the Couple the essence?
      (28) (Who are the) Siddhas in the teaching of the three (lineages) (tritayaśāsana)?
      (29) Who has authority in the South? (30) What is the group of nine? (15) (31)
      Moreover, (what are) the eighteen divisions? (32) And (what is) the Hermitage
      (aśrama) which is the first maSÆala? (33) O goddess, how can one know the purification
      (saˆskāra) (that takes place) by means of the Triple Transmission? (16) (34)
      Who is the fettered soul here? (35) (Pray tell me) in brief how the maSÆala
      is and (36) by means of what essential nature does the destruction of impurity
      take place? (17) (37) What is said to be the body (piSÆa) that is located in
      the beginning within each single body (deha)? (38) How is Śiva? (39) What is
      the nature of the Plane of Repose in the middle of (his) fire? (18) O goddess,
      (40) what is the realisation that is ones own authority? (41) Who is the one
      here who has emanated (this)? And (42) how is Bhairava? (19) (43) Who is said
      to be Kaulīśa? O Vakrikā, if you are satisfied tell me everything in due order,
      by (your) grace. (20) This is the first chapter called Concerning Śrīnāthas
      Enquiry. It belongs to the primordial descent into the great sacrifice of the
      Churning Bhairava in the tradition (anvaya) that consists of seventy million
      (verses) that has emerged on the Path of Meru and (extends) for a hundred and
      twenty-five thousand (verses). It has been brought (down to earth) into the
      first sacred seat along the path of the Seat of Knowledge (vidyāpī˜ha). It is
      the ultimate purport of the Pure Six (Thousand Verses vimalana˜ka) in the division
      beginning with `Kā in the venerable scripture of twenty-four thousand (verses
      - caturviˆśatsahasrasaˆhitā) (known as) the Svāminīmata of the Supreme Lords
      command as uttered within the Tradition of the Mother (avvākrama).
    source_page: '23'
