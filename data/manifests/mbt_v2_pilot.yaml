  sanskrit: ।। ॐ स्वस्ति ।। श्रीनाथपादुकाभ्यां नमः । श्रीगणेशाय नमः । मन्थानभैरवतन्त्रे
    कुमारिकाखण्डे प्रथमानन्दः संवतीमण्डलान्ते क्रमपदनिहितानन्दशक्तिः सुभीमा सृष्टिन्यायें
    चतुष्क त्वकुलकुलग पञ्चक चान्यषट्कम् । चत्वारः पञ्चकोऽन्यः पुनरपि चतुरः षोडशाज्ञाभिषेक
    दिव्याष्टौ मूर्तिमध्ये हसखफरकला बिन्दुपुष्पा खमुद्रा ॥ १ ॥
  translations:
  - id: mbt.v1.1.0d62.en.dyczkowski
    translator_id: dyczkowski.mark
    translator: Mark S. G. Dyczkowski
    type: published_translation
    language: en
    text: CHAPTER ONE Śrīnāthas Inquiry The SaˆvartāmaSÆalasūtra 1Within (the centre)
      of SaˆvartāmaSÆala2 is the power of bliss (ānandaśakti). Present in (every)
      part (pada) of the Transmission (kramapadanihitā),3 she is pleasingly horrific
      (subhīmā). The quaternary is present in (both) Akula and Kula4 (as is) the pentad
      and another, the hexad, (again) the four, another pentad and again four in the
      pattern of emanation.5 There is the Sixteenfold Consecration of the Command,6
      the eight divine beings7 and, in the middle of (Kubjikās) form (mūrti), the
      energy (kalā - E) of (the consonants) Ha Sa Kha Pha Ra and the (goddess who
      is the) flower which is the Point (bindupunpā)8 and the Gesture of Space (khamudrā).9
      (1) (There is the Transmission of the) Child, the Youth and the Aged. She is
      the goddess Vakrā (the Crooked One), the energy of Supreme Śiva of (all) the
      Transmissions (krama). (Along with her) Śrīnātha10 (resides in) the City of
      the Moon11 manifested (kalita) (along with) the eighteen (Nāthas).12 Indeed,
      the category of the Couple is the essence (of the Divine Current).13 The three
      (constitute) the descent of the Siddhas in the beginning of the Age of Strife
      (prathamakaliyuga)14 and the (spiritual) authority (that was thereby established
      in the land of) Ko‰kaSa.15 These (three) had disciples (who were their spiritual)
      sons in the Lineage of the Nine Persons (navapurunakrama). Sixteen (disciples)
      (dviran˜au)16 (arose) from amongst them. (2) The lineage (santāna), the body
      (formed from the) clans (gotrapiSÆa),17 all the parts (pada) of the Transmission
      (kramapadasakala), the End of the Sixteen (noÆaśānta)18 that is the culmination
      of the Transmission (kramānta),19 the remaining maSÆalas,20 the pure rotation
      (of KuSÆalinī) (paribhrama)21- (this) is the collection of the (teachings concerning)
      the essential nature (of the deity who is the) object of worship (pūjyasadbhāvavrndam).22
      In the beginning23 the entire Kulakrama is within the (group of) eighteen (Nāthas)
      prior to the emergence of the maSÆala.24 The purification (saˆskāra)25 that
      destroys the impurity of the fettered26 by means of the Triple Transmission
      (trikrama)27 is the purification of the body (piSÆa) in the fire of Śiva.28
      (3) In the centre is the Plane of Repose,29 it is the spread (of emanation)
      (prasara) and the experience (of ultimate reality),30 realisation (pratyaya)31
      and ones own authority.32 (You all) bow (namatha) to him by whom (all this)
      has been emitted,33 the best of teachers, Bhairava, the venerable Kulīśa!34
      (4)
    source_page: '19'
