- id: mbt.v2.7.b2df
  chapter: '2'
  verse: '7'
  type: verse
  transliteration: Devanagari
  critical_status: vision_ocr_unreviewed
  source_page: '26'
  sanskrit: कुमारिकाखण्डः भर्गपूर्वक्रम यच्च” विलोमांशे¨ व्यवस्थितम्” । क्रमं तु नवधा
    भिन्नं वृद्धं कौमारबालकम् ।। ७ ।।
  translations:
  - id: mbt.v2.7.b2df.en.dyczkowski
    translator_id: dyczkowski.mark
    translator: Mark S. G. Dyczkowski
    type: published_translation
    language: en
    text: 'CHAPTER TWO 11 The Transmission 15The Transmission (krama) that begins
      with Bharga is established in the reverse aspect.16 Again, the transmission
      is divided nine times. It is that of the Aged, the Youth and the Child. (7cd-7ef)
      The Groups of Four, Five, Six, Four, Five and Four 17The intellect, will, knowledge
      and (the energy) called action whose power has been made manifest: this is the
      tetrad. The subtle elements namely, the five - sound and the rest: this is the
      pentad of knowledge. The skin, eye, nose, tongue and hearing, along with the
      mind (manas): this is the hexad called action. Waking, sleep, deep sleep and
      the other state established in the Fourth: that is the tetrad. Water, fire,
      earth, wind and sky are the group of Five Jewels.18 Vrknanātha19 abides (there)
      endowed with the qualities of the three qualities namely, sattva, rajas and
      tamas.20 (8-9ab) The Six Modalities of the Goddess and Mūlanātha, the Root Lord
      21The venerable (goddess) Kubjī has six modalities (na˜prakārā).22 She is the
      energy (E) of Ha Sa Kha Pha Ra and, pervading (all things), is called the Yoni
      (bhaga). When she who is Rudras power, the treasure of Supreme Bliss, is aroused
      and has entered within him (i.e. Vrknanātha), then the six modalities (prakāra)
      that are (her) enclosures (āchādaka) are again merged into the Root Lord (Mūlanātha).23
      By churning from above, the Divine Li‰ga is divided into six modalities (prakāra)
      namely, the sacred seats (pī˜ha) and the rest. The (goddess) called Vakrikā
      (resides) there. She is the bliss of the Command (ājñā), pure with blissful
      intercourse (sukharati). She creates all things and destroys (them). She is
      consciousness and, abiding in the supreme state, she bestows both (worldly)
      enjoyment and liberation. (9cd-10) The Consecration 24This consecration (abhineka)
      takes place once the Self has been flooded with the supreme nectar (that flows
      from the psychic centre) of the uvula (after) having laid hold (ādāya) of the
      Void (kha)25 in order to play (lalanārtha). (11) The Clan 26Mālinī and Śabdarāśi
      having pervaded the clan (gotra) are (well) established. That clan is the agent
      of emanation and the universe enveloped by Śiva and Śakti. 27 (12)'
    source_page: '27'
