  sanskrit: कुमारिकाखण्डः क्रमनायकिविख्याता”“ साधिकारे तु शाम्भवें । पञ्चाशद्भुवनव्याप्ति:७८
    कालाग्न्यादिशिवान्तिका ।। ४० ।।
  translations:
  - id: mbt.v1.40.dd78.en.dyczkowski
    translator_id: dyczkowski.mark
    translator: Mark S. G. Dyczkowski
    type: published_translation
    language: en
    text: CHAPTER TWO 19 79She is known as the Mistress of the Transmission (kramanāyakī)
      within Śivas (śāmbhava) sphere of authority. She is the pervasion of the fifty
      worlds that ranges from the Fire of Time (kālāgni) up to Śiva in the end.80
      There, in the centre, I have emanated the moving and immobile (universe) of
      four kinds.81 She has three qualities,82 three measures (trimātrā)83 and abides
      in the form of emanation. (40-41) Bhairava and Kaulīśa 84Bhairava is (the god)
      whose form is full (bharita) (of all things). Devoid of origin and end, he is
      great. Stainless (nirñjana), he fills (bharati) with nectar (his) body which
      is the Void (vyomagātra). He emits (vamati) the essence of knowledge and so
      he is Bhairava, the lord. Imperishable and devoid of decay, he is known as Bhairava.85
      The lord (īśa) abides in the centre between Kula and Kaula.86 He is the lord
      of all the gods and is known as Kaulīśa. (42-44) The Four Siddhas The group
      of four (catunka) (is formed) by means of the four divisions and that energy
      is also fourfold. Again, MI (Mitranātha), ±a (±an˜hanātha), Ca (Caryānātha)
      and O (OÆÆīśanātha) are famous. They have shown the path (paddhati).87(45) This
      is the second chapter which is the emergence of the transmission (kramodaya)
      with regards to the description Concerning the Response to the Inquiry. It belongs
      to the primordial descent into the great sacrifice of the Churning Bhairava
      in the tradition (anvaya) that consists of seventy million (verses) that has
      emerged on the Path of Meru and (extends) for a hundred and twenty-five thousand
      (verses). It has been brought (down to earth) into the first sacred seat along
      the path of the Seat of Knowledge (vidyāpī˜ha). It is the ultimate purport of
      the Pure Six (Thousand Verses vimalana˜ka) in the division beginning with `Kā
      in the venerable scripture of twenty-four thousand (verses) (known as) the Svāminīmata
      of the Supreme Lords command as uttered within the Transmission of the Mother
      (avvākrama).
    source_page: '35'
