- id: mbt.v3.29.ccc2
  chapter: '3'
  verse: '29'
  type: verse
  transliteration: Devanagari
  critical_status: vision_ocr_unreviewed
  source_page: '42'
  sanskrit: कुमारिकाखण्डः तथा शृणुष्व भो नाथ योगकारणमुत्तमम् । विस्तरेणाभिधास्यामि
    पूर्वं यत् सूचितं मया ।। २९ ।।
  translations:
  - id: mbt.v3.29.ccc2.en.dyczkowski
    translator_id: dyczkowski.mark
    translator: Mark S. G. Dyczkowski
    type: published_translation
    language: en
    text: CHAPTER THREE 27 More concerning the Triangle in the centre And so listen,
      O lord, to the most excellent cause of Yoga. I will (now) explain in detail
      what I previously (merely) indicated to you. (29) The cave hermitage (āśrama)
      of TūnSīnātha (the Silent Lord) is located in a large and beautiful grove situated
      on the peak of the temple of Meru, which is another form of (mount) Kailāsa.
      (30) It is triangular and appears to have seven sections (skandha). It is surrounded
      by the Octad of Kula.42 (The three sides together measure) three times a hundred
      leagues (long)43 and it is surrounded by the Twelve Verses.44 (Within it reside)
      the fifty Siddhas and Yoginīs born of the will of the Śrīkula.45 The Stone is
      made of three parts. (One) begins with (the letter) `A, (another) begins with
      (the letter) `Ka and (the third) begins with (the letter) `Tha.46 (31-32) She
      is the Mother of the (eight) mothers of Kula47 who bestows liberation to the
      accomplished (siddha). She who is mantra and gesture (mudrā) in the Three Lineages
      (trayoli) has emerged from the Cave Dwelling as menstruation (rajobhāva) (and
      such) is (her) form which is lauded as menstruated (punpavat).48 That is the
      Stone (śilā), beautiful as the moon, the light of which is like heated gold.
      (33-34) Clearly visible, (the Command) is located between (the letters) Ha and
      K±a and is conjoined in the centre with Amā (the New Moon).49 Residing within
      energy and located in the middle of energy, (the Command) flows out from (between)
      the two, Ha and K±a into the igneous maSÆala of the Yoni, that is, into the
      Triangle which is the foundation of the world.50 (35-36ab) The Circle of the
      Sun is outside that. It is light red and very brilliant. Delightful, that is
      one hundred and fifty leagues all around.51 Its form that of an unbroken circle,
      it is the world of all yogis. (36cd-37) Bhairava and Bhairavī in the Centre
      The tradition (taught in) seventy million (verses) has emerged from the (triangle
      in the) middle of that.52 And so has the formidable (ghora) Bhairava called
      the lion of the thirty-two (syllable Vidyā).53 (38) He resides within the seed-syllable,54
      possesses five states and, residing in (his divine) energy (śakti), is established
      fivefold.55 Seated next to him56 is the Vidyā who rains down the nectar of SūnmaSā.57
      (39)
    source_page: '43'
