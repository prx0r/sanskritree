    विज्ञातमात्रेण संवित्तिर्भवते स्फुटा ॥ १ ॥
  translations:
  - id: mbt.v2.1.7347.en.dyczkowski
    translator_id: dyczkowski.mark
    translator: Mark S. G. Dyczkowski
    type: published_translation
    language: en
    text: 'CHAPTER TWO The Response to the Inquiry The venerable (goddess) Vakrā said:
      O Lord! Greatly wise one! Repository of Kula and Kaula! Listen. I will explain
      that, namely, (the true nature of) the Supreme Goddess (parameśvarī) Vakrikā,
      by just knowing which the realisation (of attainment) (saˆvitti)1 is clearly
      evident (sphu˜ā). (1-2ab) The one who acts within the MaSÆala and the MaSÆala
      He2 whom (the wise) call Śāvara3 and the like is one and has assumed many forms.
      He resides permanently within the maSÆala and (is the one there who) engenders
      emanation and withdrawal. (2cd-3ab) 4The maSÆala in the Kula transmission (kulakrama)
      is always peaceful, pervasive, unbroken and perpetually manifest (nityodita).
      It is (dark blue) like the flower of the hemp plant (atasī).5 (3cd-4ab) The
      Power of Bliss 6Merged between the exhaled (prāSa) and inhaled breath (apāna),
      (she is) said to be the power of bliss. Located in the middle of the Stick of
