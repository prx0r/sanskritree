passages:
- id: ts.1
  sanskrit: bālānāṃ sukhabodhāya kriyate tarkasaṃgrahaḥ
  type: definition
  verse: '1'
- id: ts.2
  sanskrit: dravyaguṇakarmasāmānyaviśeṣasamavāyābhāvāḥ sapta padārthāḥ
  type: definition
  verse: '2'
- id: ts.3
  sanskrit: tatra dravyāṇi pṛthivyaptejovāyvākāśakāladigātmamanāṃsi navaiva
  type: definition
  verse: '3'
- id: ts.4
  sanskrit: rūparasagandhasparśasaṃkhyāparimāṇapṛthaktvasaṃyogavibhāgaparatvāparatvagurutvadravatvasnehaśabdabuddhisukhaduḥkhecchādveṣaprayatnadharmādharmasaṃskārāś
    caturviṃśati guṇāḥ
  type: definition
  verse: '4'
- id: ts.5
  sanskrit: utkṣepaṇāvakṣepaṇākuñcanaprasāraṇagamanāni pañca karmāṇi
  type: definition
  verse: '5'
- id: ts.6
  sanskrit: param aparaṃ ceti dvividhaṃ sāmānyam
  type: definition
  verse: '6'
- id: ts.7
  sanskrit: nityadravyavṛttayo viśeṣās tv anantā eva
  type: definition
  verse: '7'
- id: ts.8
  sanskrit: samavāyas tv eka eva
  type: definition
  verse: '8'
- id: ts.9
  sanskrit: abhāvaś caturvidhaḥ / prāgabhāvaḥ pradhvaṃsābhāvo 'tyantābhāvo 'nyonyābhāvaś
    ceti
  type: definition
  verse: '9'
- id: ts.10
  sanskrit: gandhavatī pṛthivī / sā dvividhā nityānityā ca / nityā paramāṇurūpā /
    anityā kāryarūpā / punas trividhā śarīrendriyaviṣayabhedāt / śarīram asmadādīnām
    / indriyaṃ gandhagrāhakaṃ ghrāṇaṃ nāsāgravarti / viṣayo mṛtpāṣāṇādiḥ
  type: definition
  verse: '10'
- id: ts.11
  sanskrit: śitasparśavatya āpaḥ / tā dvividhāḥ nityā anityāś ca / ntyāḥ paramāṇurūpāḥ
    / anityāḥ kāryarūpāḥ. / punas trividhāḥ. śarīrendriyaviṣayabhedāt / śarīraṃ varuṇaloke
    / indriyaṃ rasagrāhakaṃ rasanaṃ jihvāgravarti / viṣayaḥ saritsamudrādiḥ
  type: definition
  verse: '11'
- id: ts.12
  sanskrit: uṣṇasparśavat tejaḥ / tad dvividhaṃ nityam anityaṃ ca / niyyaṃ paramāṇurūpam
    / anityaṃ kāryarūpam / punas trividhaṃ śarīrendriyaviṣayabhedāt / śarīram ādityaloke
    / indriyaṃ rūpagrāhakaṃ cakṣuḥ kṛṣṇatārāgravarti / viṣayaś caturvidhaḥ / bhaumadivyaudaryākarajabhedāt
    / bhaumaṃ vahnyādikam / abindhanaṃ divyaṃ vidyudādi / bhuktasya pariṇāmahetur
    audaryam. ākarajaṃ suvarṇādi
  type: definition
  verse: '12'
- id: ts.13
  sanskrit: rūparahitasparśavān vāyuḥ / sa dvividho nityo 'nityaś ca / nityaḥ paramāṇurūpaḥ
    / anityaḥ kāryarūpaḥ / punas trividhaḥ śarīrendriyaviṣayabhedāt / śarīraṃ vāyuloke
    / indriyaṃ sparśagrāhakaṃ tvaksarvaśarīravarti / viṣayo vṛkṣādikampanahetuḥ //
    śarīrāntaḥsaṃcārī vāyuḥ prāṇaḥ / sa caiko 'py upādhibhedāt prāṇāpānādisaṃjñā labhate
  type: definition
  verse: '13'
- id: ts.14
  sanskrit: śabdaguṇam ākāśam / tac caikaṃ vibhu nityaṃ ca
  type: definition
  verse: '14'
- id: ts.15
  sanskrit: atītādivyavahārahetuḥ kālaḥ / sa caiko vibhur nityaś ca
  type: definition
  verse: '15'
- id: ts.16
  sanskrit: prācyādivyavahārahetur dik / sā caikā vibhvī nityā ca
  type: definition
  verse: '16'
- id: ts.17
  sanskrit: jñānādhikaraṇam ātmā / sa dvividhaḥ paramātmā jīvātmā ca / tatreśvaraḥ
    sarvajñaḥ paramātmaika eva / jīvātmā pratiśarīraṃ bhinno vibhur nityaś ca
  type: definition
  verse: '17'
- id: ts.18
  sanskrit: sukhādyupalabdhisādhanam indriyaṃ manaḥ / tac ca pratyātmaniyatatvād anantaṃ
    paramāṇurūpaṃ nityaṃ ca
  type: definition
  verse: '18'
- id: ts.19
  sanskrit: cakṣurmātragrāhyo guṇo rūpam / tac ca śuklanīlapītaraktaharitakapiśacitrabhedāt
    saptavidhaṃ pṛthivījalatejovṛtti / tatra pṛthivyāṃ saptavidham / abhāsvaraśuklaṃ
    jale / bhāsvaraśuklaṃ tejasi
  type: definition
  verse: '19'
- id: ts.20
  sanskrit: rasanagrāhyo guṇo rasaḥ / sa ca madhurāmlalavaṇakaṭukaṣāyatiktabhedāt
    ṣaḍvidhaḥ / pṛthivyāṃ ṣaḍvidhaḥ / jale madhura eva
  type: definition
  verse: '20'
- id: ts.22
  sanskrit: tvagindriyamātragrāhyo guṇo saparśaḥ / sa ca trividhaḥ śitoṣṇānuṣṇāśītabhedāt
    / pṛthivyaptejovāyuvṛttiḥ / tatra śīto jale / uṣṇas tejasi / anuṣṇāśītaḥ pṛthivīvāyvoḥ
  type: definition
  verse: '22'
- id: ts.23
  sanskrit: rūpādicatuṣṭayaṃ pṛthivyāṃ pākajam anityaṃ ca / anyatrāpākajaṃ nityam
    antyaṃ ca / nityagataṃ nityam / anityagatam anityam
  type: definition
  verse: '23'
- id: ts.24
  sanskrit: ekatvādivyavahārahetuḥ saṃkhyā / navadravyavṛttir ekatvādiparārdhaparyantā
    / ekatvaṃ nityam anityaṃ ca / nityagataṃ nityam anityagatam anityam / dvitvādikaṃ
    tu sarvatrānityam eva
  type: definition
  verse: '24'
- id: ts.25
  sanskrit: mānavyavahārakāraṇaṃ parimāṇaṃ / navadravyavṛtti / tac caturvidham / aṇu
    mahad dīrghaṃ hrasvaṃ ceti
  type: definition
  verse: '25'
- id: ts.26
  sanskrit: pṛthagvyavahārakāraṇaṃ pṛthagtvaṃ / sarvadravyavṛtti
  type: definition
  verse: '26'
- id: ts.27
  sanskrit: saṃyuktavyavahārahetuḥ saṃyogaḥ / sarvadravyavṛttiḥ
  type: definition
  verse: '27'
- id: ts.28
  sanskrit: saṃyoganāśako guṇo vibhāgaḥ / sarvadravyavṛttiḥ
  type: definition
  verse: '28'
- id: ts.29
  sanskrit: parāparavyavahārāsādhāraṇakāraṇe paratvāparatve / pṛthivyādicatuṣṭayamanovṛttīti
    / te dvividhe dikkṛte kālakṛte ca / dūrasthe dikkṛtaṃ paratvam / samīpasthe dikkṛtam
    aparatvam / jyeṣṭhe kālakṛthaṃ paratvam / kaniṣṭhe kālakṛtam aparatvam
  type: definition
  verse: '29'
- id: ts.30
  sanskrit: ādyapatanāsamavāyikāraṇaṃ gurutvaṃ / pṛthivījalavṛtti
  type: definition
  verse: '30'
- id: ts.31
  sanskrit: ādyasyandanāsamavāyikāraṇaṃ dravatvaṃ pṛthivyaptejovṛtti / tad dvividhaṃ
    sāṃsiddhikaṃ naimittikaṃ ca / sāṃsiddhikaṃ jale naimittikaṃ pṛthivītejasoḥ / pṛthivyāṃ
    ghṛtādāvagnisaṃyogajanyaṃ daravatvam / tejasi suvarṇādau
  type: definition
  verse: '31'
- id: ts.32
  sanskrit: cūrṇādipiṇḍībhāvahetur guṇaḥ snehaḥ / jalamātravṛttiḥ
  type: definition
  verse: '32'
- id: ts.33
  sanskrit: śrotragrāhyo guṇaḥ śabdaḥ / ākāśamātravṛttiḥ / sa dvividho dvanyātmako
    varṇātmakaś ceti / dvanyātmako bheryādau / varṇātmakaḥ saṃskṛtabhāṣādirūpaḥ
  type: definition
  verse: '33'
- id: ts.34
  sanskrit: sarvavyavahārahetur buddhir jñānam / sā dvividhā smṛtiranubhavaś ca /
    saṃskāramātrajanyaṃ jñānaṃ smṛtiḥ / tadbhinnaṃ jñānam anubhavaḥ
  type: definition
  verse: '34'
- id: ts.35
  sanskrit: sa dvividho yathārtho 'yathārthaś ca / tadvati tatprakārako 'nubhavo yathārthaḥ
    / yathā rajata idaṃ rajatam iti jñānam / sa eva pramety ucyate / tadabhāvavati
    tatprakārako 'nubhavo 'yathārthaḥ / yathā śuktāv idaṃ rajatam iti jñānam
  type: definition
  verse: '35'
- id: ts.36
  sanskrit: yathārthānubhavaś caturvidhaḥ pratyakṣānumityupamitiśabdabhedāt / tatkaraṇam
    api caturvidhaṃ pratyakṣānumānopamānaśabdabhedāt
  type: definition
  verse: '36'
- id: ts.41
  sanskrit: tad etattrividhakāraṇamadhye yad asādhāraṇaṃ kāraṇaṃ tad eva karaṇam
  type: definition
  verse: '41'
- id: ts.42
  sanskrit: tatra pratyakṣajñānakaraṇaṃ pratyakṣam / indriyārthasannikarṣajanyaṃ jñānaṃ
    pratyakṣam /tad dvividhaṃ nirvikalpakaṃ savikalpakaṃ ceti / tatra nirvikalpakaṃ
    jñānaṃ nirvikalpakaṃ yathedaṃ kiṃcit / saparakārakaṃ jñānaṃ savikalpakaṃ yathā
    ḍittho'yam brahmaṇo'yaṃ śyāmo'yam iti
  type: definition
  verse: '42'
- id: ts.43
  sanskrit: pratyakṣajñānahetur indriyārthasannikarṣaḥ ṣaḍvidhaḥ / saṃyogaḥ saṃyuktasamavāyaḥ
    saṃyuktasamavetasamavāyaḥ samavāyaḥ samavetasamavāyo viśeṣaṇaviśeṣyabhāvaś ceti
    / cakṣuṣā ghaṭapratyakṣajanane saṃyogaḥ sannikarṣaḥ / ghaṭarūpapratyakṣajanane
    saṃyuktasamavāyaḥ sannikarṣaḥ cakṣuḥsaṃyukte ghaṭe rūpasya samavāyāt / rūpatvasāmānyapratyakṣe
    saṃyuktasamavetasamavāyaḥ sannikarṣaḥ cakṣuḥsaṃyukte ghaṭe rūpaṃ samavetaṃ tatra
    rūpatvasya samavāyāt / śrotreṇa śabdasyākāśaguṇatvāt guṇaguṇinoś ca samavāyāt
    / śabdatvasākṣātkāre samavetasamavāyaḥ sannikarṣaḥ śrotrasamavete śabde śabdatvasya
    samavāyāt / abhāvaparatyakṣe viśeṣaṇaviśeṣyabhāvaḥ sannikarṣo ghaṭābhāvavad bhṛtalam
    ity atra cakṣuḥsaṃyukte bhūtale ghaṭābhāvasya viśeṣaṇatvāt / evaṃ snnikarṣaṣaṭkajanyaṃ
    jñānaṃ pratyakṣam / tatkaraṇam indriyam / tasmād indriyaṃ pratyakṣapramāṇam iti
    siddham
  type: definition
  verse: '43'
- id: ts.44
  sanskrit: anumitikaraṇam anumānam / parāmarśajanyaṃ jñānam anumitiḥ / vyāptiviśiṣṭapakṣadharmatājñānaṃ
    parāmarśaḥ / yathā vahnivyāpyadhūmavān ayaṃ parvata iti jñānaṃ parāmarśaḥ / taj
    janyaṃ parvato vahnimān iti jñānam anumitiḥ / yatra yatra dhūmas tatrāgnir iti
    sāhacaryaniyamo vyāptiḥ / vyāpyasya parvatādivṛttitvaṃ pakṣadharmatā
  type: definition
  verse: '44'
- id: ts.45
  sanskrit: anumānaṃ dvividhaṃ svārthaṃ parārthaṃ ca / tatra svārthaṃ svānumitihetuḥ
    / tathā hi svayam eva bhūyo darśanena yatra dhūmas tatra agnir iti mahānasādau
    vyāptiṃ gṛhītvā parvatasamīpaṃ gatas tadgate cāgnau sandihānaḥ parvate dhūmaṃ
    paśyan vyāptiṃ smarati yatra dhūmas tatrāgnir iti / tadantaraṃ vahnivyāpyadhūmavān
    ayaṃ parvata iti jñānam utpadyate / ayam eva liṅgaparāmarṣaṃ ity ucyate / tasmāt
    parvato vahnimān iti jñānam anumitir utpadyate / tad etat svārthānumānam / yat
    tu svayaṃ dhūmād agnim anumāya parapratipattyarthaṃ pañcāvayavavākyaṃ prayukte
    tat parārthānumānam / yathā parvato vahnimān dhūmavattvāt / yo yo dhūmavān sa
    vahnimān yathā mahānasaḥ / tathā cāyam / tasmāt tatheti / anena pratipāditāl lingāt
    paro'py agniṃ pratipadyate
  type: definition
  verse: '45'
- id: ts.46
  sanskrit: pratijñāhetūdāharaṇopanayanigamāni pañcāvayavaḥ / parvato vahnimān iti
    pratijñā / dhūmavattvād iti hetuḥ / yo yo dhūmavān sa so'gnimān yathā mahānasa
    ity udāharaṇam / tathā cāyam iti upanayaḥ / tasmāt tatheti nigamanam
  type: definition
  verse: '46'
- id: ts.47
  sanskrit: svārthānumitiparārthānumityor liṅgaparāmarśa eva karaṇam / tasmāl liṅgaparāmarśā'numānam
  type: definition
  verse: '47'
- id: ts.48
  sanskrit: liṅgaṃ trividham / anvayavyatireki kevalānvayi kevalavyatireki ceti /
    anvayena vyatirekeṇa ca vyāptimad anvayavyatireki / yathā vahnau sādhye dhūmavattvam
    / yatra dhūmas tatrāgnir yathā mahānasa ity anvayavyāptiḥ / yatra vahnir nāsti
    tatra dhūmo'pi nāsti yathā mahāhrada iti vyatirekavyāptiḥ / anvayamātravyāptikaṃ
    kevalānvayi yathā ghaṭo'bhidheyaḥ prameyatvāt paṭavat / atra prameyatvābhidhyatvayor
    vyatirekavyāptir nāsti sarvasyāpi prameyatvād abhidheyatvāc ca / vyatirekamātravyāptikaṃ
    kevalavyatireki yathā pṛthivī tarebhyo bhidyate gandhavattvāt / yad itarebhyo
    na bhidyate na tad gandhavat / yathā jalam / na ceyaṃ tathā / tasmān na tatheti
    atra yad gandhavat tad itarabhinnam ity anvayadṛṣṭanto nāsti pṛthivīmātrasya pakṣatvāt
  type: definition
  verse: '48'
- id: ts.49
  sanskrit: saṃdigdhasādhyavān pakṣaḥ / yathā dhūmavattve hetau parvataḥ
  type: definition
  verse: '49'
- id: ts.50
  sanskrit: niścitasādhyavān sapakṣaḥ / yathā tatraiva mahānasaḥ
  type: definition
  verse: '50'
- id: ts.51
  sanskrit: niścitasādhyābhāvavān vipakṣaḥ / yathā tatraiva mahāhradaḥ
  type: definition
  verse: '51'
- id: ts.52
  sanskrit: savyabhicāraviruddhasatpakṣāsiddhabādhitāḥ pañca hetvābhāsāḥ
  type: definition
  verse: '52'
- id: ts.53
  sanskrit: savyabhicāro'naikāntikaḥ / sa trividhaḥ / sādhāraṇāsādhāraṇānupasaṃhāribhedāt
    / tatra sādhyābhāvavadvṛttiḥ sādhāraṇo anaikāntikaḥ / yathā parvato vahnimān prameyatvād
    iti prameyatvasya vahnyabhāvavati hrade vidyamānatvāt / sarvasapakṣavipakṣavyāvṛtto'sādhāraṇaḥ
    / yathā śabdo nityaḥ śabdatvād iti / śabdatvaṃ sarvebhyo nityebhyo'ntyebhyaś ca
    vyāvṛttaṃ śabdamātravṛtti / anvayavyatirekadṛṣṭāntarahito'nupasaṃhārī / yathā
    sarvam anityaṃ prameyatvād iti / atra sarvasyāpi pakṣatvād dṛṣṭānto nāsti
  type: definition
  verse: '53'
- id: ts.54
  sanskrit: sādhyābhāvavyāpto hetur viruddhaḥ / yatra śabdo nityaḥ kṛtakatvād iti
    / kṛtakatvaṃ hi nityatvābhāvenānityatvena vyāptam
  type: definition
  verse: '54'
- id: ts.55
  sanskrit: yasya sādhyabhāvasādhakaṃ hetvantaraṃ vidyate sa satpratipakṣaḥ / yathā
    śabdo nityaḥ śrāvaṇatvāc chabdatvavad iti / śabdo'nityaḥ kāryatvād ghaṭavad iti
  type: definition
  verse: '55'
- id: ts.56
  sanskrit: asiddhas trividhaḥ / āśrayāsiddhaḥ svarūpāsiddho vyāpyatvāsiddhaś ceti
    / āśrayāsiddho yathā gaganāravindaṃ surabhy aravindatvāt sarojāravindavat / atra
    gaganāravindam āśrayaḥ / sa ca nāsty eva / svarūpāsiddho yathā śabdo guṇaś cākṣuṣatvāt
    / atra cākṣuṣatvaṃ śabde nāsti śabdasya śrāvaṇatvāt / sopādhiko vyāpyatvāsiddhaḥ
    / sādhyavyāpakatve sati sādhanāvyāpaka upādhiḥ / sādhyasamānādhikaraṇātyantābhāvāpratiyogitvaṃ
    sādhyavyāpakatvam / sādhanavann iṣṭātyantābhāvapratiyogitvaṃ sādhāraṇāvyapakatvam
    / parvato dhūmavān vahnimattvād ity atrārdrendhasaṃyoga upādhiḥ / tathā hi / yatra
    dhūmas tatrārdrendhnasaṃyoga iti sādhyavyāpakatā / yatra vahnis tatrārdrendhanasaṃyogābhāvād
    iti sādhanāvyāpakatā / evaṃ sādhyavyāpakatve sati sādhanāvyāpakatvād ardrendhanasaṃyoga
    upādhiḥ / sopādhikatvād vahnimattvaṃ vyāpyatvāsiddham
  type: definition
  verse: '56'
- id: ts.57
  sanskrit: yasya sādhyābhāvaḥ pramāṇāntareṇa niścitaḥ sa bādhitaḥ / yathā vahnir
    anuṣṇo dravyatvād iti / atrānuṣṇatvaṃ sādhyaṃ tadabhāva uṣṇatvaṃ spārśanapratyakṣeṇa
    gṛhyata iti bādhitatvam
  type: definition
  verse: '57'
- id: ts.58
  sanskrit: upamitikaraṇam upamānam / saṃjñāsaṃjñisaṃbandhajñānam upamitiḥ / tatkaraṇaṃ
    sādṛśyajñānam / atideśavākyārthasmaraṇam avāntaravyāpāraḥ / tathā hi kaś cid gavayaśabdārtham
    ajānan kutaś cid āraṇyakapuruṣād gosadṛśo gavaya iti śrutvā vanaṃ gato vākyārthaṃ
    smaran gosadṛṣaṃ piṇḍaṃ paśyati / tadanantaram asau gavayaśabdavācya ity upamitir
    utpadyte
  type: definition
  verse: '58'
- id: ts.59
  sanskrit: āptavākyaṃ śabdaḥ / āptas tu yathārthavaktā / vākyaṃ padasamūhaḥ / yathā
    gām ānayeti / śaktaṃ padam / asmāt padād ayam artho boddhavya itīśvarasaṃketaḥ
    śaktiḥ
  type: definition
  verse: '59'
- id: ts.60
  sanskrit: ākāṅkṣā yogyatā saṃnidhiś ca vākyārthajñānahetuḥ / padasya padāntaravyatirekaprayuktānvayānanubhāvakatvam
    ākāṅkṣā / arthābādho yogyatā / padānāmavilambenoccāraṇaṃ saṃnidhiḥ
  type: definition
  verse: '60'
- id: ts.61
  sanskrit: ākāṅkṣādirahitaṃ vākyam apramāṇam / yathā gaur aśvaḥ puruṣo hastīti na
    pramāṇam ākāṅkṣāvirahāt / agninā siñced iti na pramāṇaṃ yogyatāvirahāt / prahare
    prehare'sahoccāritāni gām ānayetyādipadāni na pramāṇaṃ saṃnidhyabhāvāt
  type: definition
  verse: '61'
- id: ts.62
  sanskrit: vākyaṃ dvividham / vaidikaṃ laukikaṃ ca / vaidikam īśvaroktatvāt sarvam
    eva pramāṇam / laukikaṃ tv āptoktaṃ pramāṇam / anyad apramāṇam
  type: definition
  verse: '62'
- id: ts.63
  sanskrit: vākyārthajñānaṃ śabdajñānam / tatkaraṇaṃ śabdaḥ
  type: definition
  verse: '63'
- id: ts.64
  sanskrit: ayathārthānubhavas trividhaḥ saṃśayaviparyayatarkabhedāt / ekasmin dharmini
    viruddhanānādharmavaiśiṣṭyāvagāhi jñānaṃ saṃśayaḥ / yathā sthāṇur vā purṣo veti
    / mithyājñānaṃ viparyayaḥ / yathā śuktāv idaṃ rajatam iti / vyāpyāropeṇa vyāpakāropas
    tarkaḥ yathā yadi vahnir na syāt tarhi dhūmo'pi na syād iti
  type: definition
  verse: '64'
- id: ts.65
  sanskrit: smṛtir api dvividhā / yathārthāyathārthā ca pramājanyā yathārthā / apramājanyāyathārthā
  type: definition
  verse: '65'
- id: ts.66
  sanskrit: sarveśām anukūlatayā vedanīyaṃ sukham
  type: definition
  verse: '66'
- id: ts.67
  sanskrit: sarveśāṃ pratikūlatayā vedanīyaṃ duḥkham
  type: definition
  verse: '67'
- id: ts.68
  sanskrit: icchā kāmaḥ
  type: definition
  verse: '68'
- id: ts.69
  sanskrit: krodho dveṣaḥ
  type: definition
  verse: '69'
- id: ts.70
  sanskrit: kṛtiḥ prayatnaḥ
  type: definition
  verse: '70'
- id: ts.71
  sanskrit: vihitakarmajanyo dharmaḥ
  type: definition
  verse: '71'
- id: ts.72
  sanskrit: niṣiddhakarmajanyas tv adharmaḥ
  type: definition
  verse: '72'
- id: ts.73
  sanskrit: buddhyādayo'ṣṭāv ātmamātraviśeṣaguṇāḥ
  type: definition
  verse: '73'
- id: ts.74
  sanskrit: buddhīcchāprayatnā dvividhāḥ / nityā anityāś ca / nityā īśvarasya / anityā
    jīvasya
  type: definition
  verse: '74'
- id: ts.75
  sanskrit: saṃskāras trividhaḥ / vego bhāvanā sthitisthāpakaś ceti / vegaḥ pṛthivyādicatuṣṭayamanovṛttiḥ
    / anubhavajanyā smṛtihetur bhāvanātmamātravṛttiḥ / anyathā kṛtasya punas tadavasthāpādakaḥ
    sthitisthāpakaḥ kaṭādipṛthivīvṛttiḥ
  type: definition
  verse: '75'
- id: ts.76
  sanskrit: calanātmakaṃ karma / ūrdhvadeśasaṃyogahetur utkṣepaṇam / adhodeśasaṃyogahetur
    apakṣepaṇam / śarīrasaṃnikṛṣṭasaṃyogahetur ākuñcanam / viprakṛṣṭasaṃyogahetuḥ
    prasāraṇam / anyat sarvaṃ gamanam / pṛthivyādicatuṣṭayamanomātravṛtti
  type: definition
  verse: '76'
- id: ts.77
  sanskrit: nityam ekam anekānugataṃ sāmānyam / dravyaguṇakarmavṛtti / tad dvividhaṃ
    parāparabhedāt / paraṃ sattā / aparaṃ dravyatvādiḥ
  type: definition
  verse: '77'
- id: ts.78
  sanskrit: nityadravyavṛttayo vyāvartakā viśeṣāḥ
  type: definition
  verse: '78'
- id: ts.79
  sanskrit: nityasaṃbandhaḥ samavāyaḥ / ayutasiddhavṛttiḥ / yayor dvayor madhya ekam
    avinaśyadaparāśritam evāvatiṣṭate tāv ayutasiddau / yathāvayavāvayavinau guṇaguṇinau
    kriyākriyāvantau jātivyaktī viśeṣanityadravye ceti
  type: definition
  verse: '79'
- id: ts.80
  sanskrit: anādiḥ sāntaḥ prāgabhāvaḥ / utpatteḥ pūrvaṃ kāryasya / sādir anantaḥ pradhvaṃsaḥ
    / utpattyanantaraṃ kāryasya / traikālikasaṃsargāvacchinnapratiyogitāko'tyantābhāvaḥ
    / yathā bhūtale ghaṭo nāstīti / tādātmyasaṃbandhāvacchinnapratiyogitāko'nyonyābhāvaḥ
    yathā ghaṭaḥ paṭo na bhavatīti
  type: definition
  verse: '80'
- id: ts.81
  sanskrit: sarveṣāṃ padārthānāṃ yathāyatham ukteṣv antarbhāvāt saptaiva padārthā
    iti siddham
  type: definition
  verse: '81'
