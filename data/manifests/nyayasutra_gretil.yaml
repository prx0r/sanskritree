  id: ns.2.1.38
  sanskrit: 'rodhopaghātasādṛśyebhyaḥ vyabhicārāt anumānam apramāṇam {pūrvapakṣa-sūtra}
    2.1.39: na, ekadeśatrāsasādṛśyebhyaḥ arthāntarabhāvāt {siddhānta-sūtra} {vartamānakālaparīkṣā}
    2.1.40: vartamānābhāvaḥ, patataḥ patitapatitavyakālopapatteḥ {pūrvapakṣa-sūtra}
    2.1.41: tayoḥ api abhāvaḥ vartamānābhāve, tadapekṣatvāt {siddhānta-sūtra} 2.1.42:
    na atītānāgatayoḥ itaretarāpekṣā siddhiḥ {siddhānta-sūtra} 2.1.43: vartamānābhāve
    sarvāgrahaṇaṃ pratyakṣānupapatteḥ {siddhānta-sūtra} 2.1.44: kṛtatākarttavyatopapatteḥ
    tu ubhayathā grahaṇam {siddhānta-sūtra}'
  section: '2'
  transliteration: IAST
  type: sutra
  verse: '38'
- chapter: '2'
  critical_status: gretil_import
  id: ns.2.2.1
  sanskrit: 'na catuṣṭvam, aitihyārthāpattisambhavābhāvaprāmāṇyāt {pūrvapakṣa-sūtra}
    2.2.2: śabde aitihyānarthāntarabhāvāt anumāne arthāpattisambhavābhāvānarthāntara
    bhāvāt ca apratiṣedhaḥ {siddhānta-sūtra} 2.2.3: arthāpattiḥ apramāṇam anaikāntikatvāt
    {arthāpattiprāmāṇyaparīkṣā} 2.2.4: anarthāpattau arthāpattyabhimānāt {nānaikāntikatvamarthāpatteḥ}
    2.2.5: pratiṣedhāprāmāṇyaṃ ca anaikāntikatvāt (-) 2.2.6: tatprāmāṇye vā na arthāpattyaprāmāṇyam
    {siddhānta-sūtra} [abhāvaprāmāṇyasiddhiḥ - avāntaraprakaraṇam] 2.2.7: na abhāvaprāmāṇyaṃ
    prameyāsiddheḥ {pūrvapakṣa-sūtra} 2.2.8: lakṣiteṣvalakṣaṇalakṣitatvāt alakṣitānāṃ
    tatprameyasiddheḥ {udāharaṇa sūtra} 2.2.9: asati arthe na abhāvaḥ iti cet na,
    anyalakṣaṇopapatteḥ {siddhānta-sūtra} 2.2.10: tatsiddheḥ alakṣiteṣu ahetuḥ {pūrvapakṣa-sūtra}
    2.2.11: na, lakṣaṇāvasthitāpekṣasiddheḥ {siddhānta-sūtra} 2.2.12: prāk utpatteḥ
    abhāvopapatteḥ ca {siddhānta-sūtra}'
  section: '2'
  transliteration: IAST
  type: sutra
  verse: '1'
