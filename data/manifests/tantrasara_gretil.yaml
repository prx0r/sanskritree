    garbhīkṛtānantavicitrabhoktṛbhogyaṃ tatra yad anugataṃ mahāprakāśarūpaṃ tat mahāsāmānyakalpaṃ
    paramaśivarūpam // abhts_8.1 yat tu '
  type: prose
