- chapter: '11'
  id: ts.11
  sanskrit: 'tantrasāra, navamam āhnikam sa ca saptadhā ṣaḍardhaśāstra eva paraṃ parameśena
    uktaḥ // abhts_9.1 tatra śivāḥ mantramaheśāḥ mantreśāḥ mantrāḥ vijñānākalāḥ pralayākalāḥ
    sakalā iti sapta śaktimantaḥ // '
  type: prose
