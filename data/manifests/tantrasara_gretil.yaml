  verse: '3'
- chapter: 'vimalakalāśrayābhinavasṛṣṭimahā jananī bharitatanuś ca pañcamukhaguptarucir
    janakaḥ /

    tadubhayayāmalasphuritabhāvavisargamayaṃ hṛdayam anuttarāmṛtakulaṃ mama saṃsphuratāt
    // abhts_1.1


    vitatas tantrāloko vigāhituṃ naiva śakyate sarvaiḥ /

    ṛjuvacanaviracitam idaṃ tu'
  id: ts.4
  sanskrit: 'tantrasāraṃ tataḥ śṛṇuta // abhts_1.2


    śrīśambhunāthabhāskaracaraṇanipātaprabhāpagatasaṃkocam /

    abhinavaguptahṛdambujam etad vicinuta maheśapūjanahetoḥ // abhts_1.3


    iha jñānaṃ mokṣakāraṇaṃ bandhanimi'
  type: prose
  verse: '4'
- chapter: '5'
  id: ts.5
  sanskrit: tantrasāra, tṛtīyam āhnikam yad etat prakāśarūpaṃ śivatattvam uktam tatra
    akhaṇḍamaṇḍale yadā praveṣṭuṃ na śaknoti tadā svātantryaśaktim eva adhikāṃ paśyan
    nirvikalpam eva bhairavasamāveśam anubhavati
  type: prose
  verse: '5'
- chapter: '6'
  id: ts.6
  sanskrit: tantrasāra, caturtham āhnikam tatra yadā vikalpaṃ krameṇa saṃskurute samanantaroktasvarūpapraveśāya
    tadā bhāvanākramasya sattarkasadāgamasadgurūpadeśapūrvakasya asti upayogaḥ //
    abhts_4.1 tathā hi vik
  type: prose
  verse: '6'
- chapter: '7'
  id: ts.7
  sanskrit: tantrasāra, pañcamam āhnikam tatra yadā vikalpaḥ svayam eva saṃskāram
    ātmani upāyāntaranirapekṣatayaiva kartuṃ prabhavati tadā asau pāśavavyāpārāt pracyutaḥ
    śuddhavidyānugraheṇa parameśaśaktirūpatām ā
  type: prose
