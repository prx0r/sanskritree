  sanskrit: tantrasāra, daśamam āhnikam uktas tāvat tattvādhvā // abhts_10.1 kalādyadhvā
    tu nirūpyate tatra yathā bhuvaneṣu anugāmi kiṃcid rūpaṃ tattvam ity uktam tathā
    tattveṣu vargaśo yat anugāmi rūpaṃ tat kalā
  type: prose
