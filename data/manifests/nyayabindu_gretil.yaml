- chapter: '3'
  id: nb.3.8
  sanskrit: 'tatra sādharmyavat prayogaḥ: yad upalabdhi-lakṣaṇa-prāptaṃ sann na upalabhyate
    so asad-vyavahāra-viṣayaḥ siddhaḥ, yathā anyaḥ kaścid dṛṣṭaḥ śaśa-viṣāṇa-ādiḥ.
    na upalabhyate ca kaścit pradeśa-viśeṣa upalabdhi-lakṣaṇa-prāpto ghaṭa ity anupalabdhi-prayogaḥ.'
  type: sutra
  verse: '8'
- chapter: '3'
  id: nb.3.9
  sanskrit: 'tathā svabhāvahetoḥ prayogaḥ: yat sat tat sarvam anityam, yathā ghaṭa-ādir
    iti śuddhasya svabhāvahetoḥ prayogaḥ.'
