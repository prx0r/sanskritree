  type: sutra
  verse: '123'
- chapter: '3'
  id: nb.3.124
  sanskrit: yathā nityaḥ śabdo amūrtatvāt. karma-vat paramāṇu-vad ghaṭa-vad iti. ete
    dṛṣṭāntābhāsāḥ sādhya-sādhana-dharma-ubhaya-vikalāḥ.
  type: sutra
  verse: '124'
- chapter: '3'
  id: nb.3.125
  sanskrit: tathā sandigdha-sādhya-dharma-ādayaś ca, yathā rāga-ādimān ayaṃ vacanād
    rathyā-puruṣa-vat. maraṇa-dharmo ayaṃ puruṣo rāga-ādimattvād rathyā-puruṣa-vat.
    asarvajño ayaṃ rāga-ādimatvād rathyā-puruṣa-vad iti.
  type: sutra
  verse: '125'
- chapter: '3'
  id: nb.3.126
  sanskrit: tathā ananvayo apradarśita-anvayaś ca, yathā yo uktā sa rāga-ādimān, iṣṭa-puruṣa-vat.
    anityaḥ śabdaḥ kṛtakatvād ghaṭa-vad iti.
  type: sutra
  verse: '126'
- chapter: '3'
  id: nb.3.127
  sanskrit: tathā viparīta-anvayaḥ, yad anityaṃ tat kṛtakam iti.
  type: sutra
  verse: '127'
- chapter: '3'
  id: nb.3.128
  sanskrit: sādharmyeṇa dṛṣṭānta-doṣāḥ.
  type: sutra
  verse: '128'
- chapter: '3'
  id: nb.3.129
  sanskrit: vaidharmyeṇa api, paramāṇu-vat karma-vat ākāśa-vad iti sādhya-ādy-avyatirekiṇaḥ.
  type: sutra
  verse: '129'
- chapter: '3'
  id: nb.3.130
  sanskrit: tathā sandigdha-sādhya-vyatireka-ādayaḥ, yathā asarvajñāḥ kapila-ādayo
    anāptā vā avidyamāna-sarvajñatā-āptatā-liṅgabhūta-pramāṇa-atiśaya-śāsanatvād iti.
    atra vaidharmya-udāharaṇam, yaḥ sarvajña āpto vā sa jyotir-jñāna-ādikam upadiṣṭavān,
    yathā ṛṣabha-vardhamāna-ādir iti. tatra asarvajñatā anāptayoḥ sādhya-dharmayoḥ
    sandigdho vyatirekaḥ.
  type: sutra
  verse: '130'
- chapter: '3'
  id: nb.3.131
  sanskrit: sandigdha-sādhana-vyatireko yathā, na trayīvidā brāhmaṇena grāhya-vacanaḥ
    kaścid vivakṣitaḥ puruṣo rāga-ādimattvād iti. atra vaidharmya-udāharaṇam, ye grāhya-vacanā
    na te rāga-ādimantaḥ. tad yathā gautama-ādayo dharma-śāstrāṇāṃ praṇetāra iti.
    gautama-ādibhyo rāga-ādimattvasya sādhana-dharmasya vyāvṛttiḥ sandigdhā.
  type: sutra
  verse: '131'
- chapter: '3'
  id: nb.3.132
  sanskrit: sandigdha-ubhaya-vyatireko yathā, avīta-rāgāḥ kapila-ādayaḥ, parigraha-āgraha-yogād
    iti. atra vaidharmyeṇa udāharaṇam, yo vīta-rāgo na tasya parigraha-āgrahaḥ, yathā
    ṛṣabha-āder iti. ṛṣabha-āder avīta-rāgatva-parigraha-āgraha-yogayoḥ sādhya-sādhana-dharmayoḥ
    sandigdho vyatirekaḥ.
  type: sutra
  verse: '132'
- chapter: '3'
  id: nb.3.133
  sanskrit: avyatireko yathā, avīta-rāgo ayaṃ vaktṛtvāt. vaidharmyeṇa udāharaṇam,
    yatra avīta-rāgatvaṃ na asti na sa vaktā, yathā upala-khaṇḍa iti. yady apy upala-khaṇḍād
    ubhayaṃ vyāvṛttaṃ tathā api sarvo vīta-rāgo na vaktā iti vyāptyā vyatireka-asiddher
    avyatirekaḥ.
  type: sutra
  verse: '133'
- chapter: '3'
  id: nb.3.134
  sanskrit: apradarśita-vyatireko yathā, anityaḥ śabdaḥ, kṛtakatvād ākāśa-vad iti
    vaidharmyeṇa.
  type: sutra
  verse: '134'
- chapter: '3'
  id: nb.3.135
  sanskrit: viparīta-vyatireko yathā, yad akṛtakaṃ tan nityaṃ bhavati iti.
  type: sutra
  verse: '135'
- chapter: '3'
  id: nb.3.136
  sanskrit: na hy ebhir dṛṣṭāntābhāsāir hetoḥ sāmānyalakṣaṇaṃ sapakṣa eva sattvaṃ
    vipakṣe ca sarvatra asattvam eva niścayena śakyaṃ darśayituṃ viśeṣa-lakṣaṇaṃ vā.
    tad arthāpattyā eṣāṃ nirāso draṣṭavyaḥ.
  type: sutra
  verse: '136'
- chapter: '3'
  id: nb.3.137
  sanskrit: dūṣaṇā nyūnatā-ādy-uktiḥ.
  type: sutra
  verse: '137'
- chapter: '3'
  id: nb.3.138
  sanskrit: ye pūrvaṃ nyūnatā-ādayaḥ sādhana-doṣā uktās teṣām udbhāvanaṃ dūṣaṇam.
    tena para-iṣṭa-artha-siddhi-pratibandhāt.
  type: sutra
  verse: '138'
- chapter: '3'
  id: nb.3.139
  sanskrit: dūṣaṇābhāsās tu jātayaḥ.
  type: sutra
  verse: '139'
- chapter: '3'
  id: nb.3.140
  sanskrit: abhūta-doṣa-udbhāvanāni jāty-uttarāṇi iti.
  type: sutra
  verse: '140'
