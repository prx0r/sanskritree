  type: sutra
  verse: '31'
- chapter: '3'
  id: nb.3.32
  sanskrit: tena hi nivṛttiṃ kathayatā pratibandho darśanīyaḥ. tasmāt nivṛtti-vacanam
    ākṣipta-pratibandha-upadarśanam eva bhavati. yac ca pratibandha-upadarśanaṃ tad
    eva anvaya-vacanam ity ekena api vākyena anvaya-mukhena vyatireka-mukhena vā prayuktena
    sapakṣa-asapakṣayor liṅgasya sadasattva-khyāpanaṃ kṛtaṃ bhavati iti na avaśyaṃ
    vākya-dvaya-prayogaḥ.
  type: sutra
  verse: '32'
- chapter: '3'
  id: nb.3.33
  sanskrit: 'anupalabdhāv api: yat sad upalabdhi-lakṣaṇa-prāptaṃ tad upalabhyata eva
    ity ukte, anupalabhyamānaṃ tādṛśam asad iti pratīter anvaya-siddheḥ.'
  type: sutra
  verse: '33'
- chapter: '3'
  id: nb.3.34
