  verse: '20'
- chapter: '3'
  id: nb.3.21
  sanskrit: 'kāryahetoḥ prayogaḥ: yatra dhūmas tatra agniḥ, yathā mahānasa-ādau. asti
    ca iha dhūma iti.'
  type: sutra
  verse: '21'
- chapter: '3'
  id: nb.3.22
  sanskrit: iha api siddha eva kāryakāraṇabhāve kāraṇe sādhye kāryahetur vaktavyaḥ.
  type: sutra
  verse: '22'
- chapter: '3'
  id: nb.3.23
  sanskrit: 'vaidharmyavataḥ prayogaḥ: yat sad upalabdhi-lakṣaṇa-prāptaṃ tad upalabhyata
    eva, yathā nīla-ādi-viśeṣaḥ. na ca evam iha upalabdhi-lakṣaṇa-prāptasya sata upalabdhir
    ghaṭasya ity anupalabdhi-prayogaḥ.'
  type: sutra
  verse: '23'
- chapter: '3'
  id: nb.3.24
  sanskrit: asaty anityatve na asty eva sattvam utpattimattvaṃ kṛtakatvaṃ vā. saṃś
    ca śabda utpattimān kṛtako vā iti svabhāvahetoḥ prayogaḥ.
  type: sutra
  verse: '24'
- chapter: '3'
  id: nb.3.25
